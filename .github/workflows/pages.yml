name: Publish Maze web prototype

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "maze-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and gameplay tests
        run: |
          node --check src/app.mjs
          node --check src/maze-world.mjs
          node --check src/maze-play.mjs
          node --check src/maze-capture.mjs
          node --check sw.js
          node --test tests/*.test.mjs
      - name: Assemble static site without forensic or copyrighted binaries
        run: |
          mkdir -p public/src
          cp index.html style.css manifest.webmanifest sw.js public/
          cp src/*.mjs public/src/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Confirm uploaded Pages artifact is indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            count="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')"
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact is visible"
              exit 0
            fi
            sleep 6
          done
          echo "Uploaded artifact not yet visible to the GitHub API" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
