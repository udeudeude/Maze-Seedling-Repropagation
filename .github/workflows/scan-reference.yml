name: Inspect a public historical Seedling photograph (research only)

on:
  workflow_dispatch:
  push:
    branches: [main, research/photo-ink-resolution-20261128]
    paths:
      - "scripts/probe-seedling-photo.mjs"
      - "scripts/compare-photo-ink-resolution.mjs"
      - "scripts/measure-paper-lattice.mjs"
      - "src/maze-shapes.mjs"
      - "src/maze-printed-grid.mjs"
      - ".github/workflows/scan-reference.yml"

permissions:
  contents: read

jobs:
  probe-historical-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode external public reference temporarily (never upload pixels)
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'Pillow>=10,<13'
          python3 - <<'PY'
          import hashlib, io, os
          from urllib.request import Request, urlopen
          from PIL import Image
          url = "https://images.vat19.com/covers/x-large/design-your-own-marble-maze.jpg"
          req = Request(url, headers={"User-Agent": "Mozilla/5.0 (historical product research)"})
          with urlopen(req, timeout=35) as response:
              raw = response.read(8_000_001)
          if len(raw)>8_000_000 or len(raw)<1000:
              raise SystemExit("Reference photo missing or exceeds the 8 MB limit")
          image = Image.open(io.BytesIO(raw))
          image.load()
          print("Reference dimensions:", image.size, "SHA256:", hashlib.sha256(raw).hexdigest())
          # Historical source verified at this exact checksum, 1200 x 1440.
          # The browser's square reference preview is a center crop, not a
          # stretched 5:6 portrait. Do not silently recalibrate another image.
          expected = "8f9a0709f252f812f0a646112565fe0d4c4060ed71713d85e02a78f75757172e"
          if hashlib.sha256(raw).hexdigest()!=expected or image.size!=(1200,1440):
              raise SystemExit("Historical source changed; inspect it before recalibrating")
          image = image.crop((0,120,1200,1320)).convert("RGBA").resize(
              (512,512), Image.Resampling.LANCZOS)
          print("Research crop: centered square 1200 x 1200 of 1200 x 1440 source")
          base = os.environ["RUNNER_TEMP"]
          with open(os.path.join(base, "photo.rgba"), "wb") as out:
              out.write(image.tobytes())
          with open(os.path.join(base, "photo1024.rgba"), "wb") as out:
              out.write(Image.open(io.BytesIO(raw)).crop((0,120,1200,1320)).convert("RGBA").resize((1024,1024), Image.Resampling.LANCZOS).tobytes())
          with open(os.path.join(base, "photo.sha"), "w") as out:
              out.write(hashlib.sha256(raw).hexdigest())
          PY
          node scripts/probe-seedling-photo.mjs "$RUNNER_TEMP/photo.rgba" "$(cat "$RUNNER_TEMP/photo.sha")"
          node scripts/compare-photo-ink-resolution.mjs "$RUNNER_TEMP/photo.rgba" "$RUNNER_TEMP/photo1024.rgba"
      - name: Do not persist third-party photo or layout
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/photo.rgba" "$RUNNER_TEMP/photo1024.rgba" "$RUNNER_TEMP/photo.sha"
