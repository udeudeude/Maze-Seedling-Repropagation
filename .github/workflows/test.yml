name: Test reconstructed maze document model

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run native Node.js tests
        run: node --test tests/*.test.mjs
